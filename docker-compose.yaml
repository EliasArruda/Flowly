services:
  db:
    image: postgres:17-alpine
    container_name: flowly

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
